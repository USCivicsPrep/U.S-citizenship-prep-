<style>
  :root{
    --paper:#F6F1E3;
    --paper-deep:#EEE5CD;
    --card:#FBF8EF;
    --ink:#211D16;
    --ink-soft:#5B5647;
    --navy:#1F3355;
    --navy-soft:#3B517A;
    --brass:#9C7A32;
    --brass-deep:#7A5E23;
    --brick:#8A3A34;
    --brick-bg:#F3E4DF;
    --forest:#3D6650;
    --forest-bg:#E3EBE1;
    --line:#D9CBA3;
    --line-soft:#E6DBBD;
    --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --sans: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(156,122,50,0.06), transparent 45%),
      radial-gradient(circle at 90% 85%, rgba(31,51,85,0.05), transparent 40%);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:700px;margin:0 auto;padding:28px 20px 80px;}
  a{color:var(--navy);}

  /* ---------- Header ---------- */
  .letterhead{
    display:flex;align-items:center;gap:16px;
    padding-bottom:18px;margin-bottom:6px;
    border-bottom:3px double var(--line);
  }
  .seal{
    flex:none;width:52px;height:52px;
  }
  .titles h1{
    font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:0.01em;
    margin:0 0 3px;color:var(--navy);
  }
  .titles p{margin:0;font-size:13.5px;color:var(--ink-soft);}

  .version-row{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    margin:18px 0 4px;
  }
  .seg{
    display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card);
  }
  .seg button{
    font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--ink-soft);
    background:transparent;border:none;padding:8px 14px;cursor:pointer;
    border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--navy);color:#F6F1E3;}
  .version-note{font-size:12.5px;color:var(--ink-soft);margin:8px 0 0;}
  .version-note a{color:var(--brass-deep);}

  /* ---------- Nav tabs ---------- */
  .tabs{
    display:flex;gap:2px;margin:22px 0 20px;border-bottom:1px solid var(--line);
  }
  .tabs button{
    font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink-soft);
    background:transparent;border:none;padding:10px 4px;margin-right:20px;cursor:pointer;
    border-bottom:2.5px solid transparent;
  }
  .tabs button.active{color:var(--navy);border-bottom-color:var(--brass);}

  /* ---------- Cards / shared ---------- */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
  .muted{color:var(--ink-soft);}
  .small{font-size:12.5px;}
  .pill{
    display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:0.02em;
    padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink-soft);
    background:var(--paper-deep);
  }
  .btn{
    font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;
    padding:9px 16px;border-radius:var(--radius);border:1px solid var(--navy);
    background:var(--navy);color:#F6F1E3;
  }
  .btn:hover{background:var(--navy-soft);}
  .btn.secondary{background:transparent;color:var(--navy);border-color:var(--line);}
  .btn.secondary:hover{border-color:var(--navy);}
  .btn.good{background:var(--forest);border-color:var(--forest);}
  .btn.bad{background:var(--brick);border-color:var(--brick);}
  .btn:disabled{opacity:0.45;cursor:default;}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid rgba(156,122,50,.55);outline-offset:2px;}
  @media (max-width:520px){.wrap{padding:20px 14px 60px}.letterhead{gap:11px}.seal{width:44px;height:44px}.titles h1{font-size:22px}.seg{width:100%}.seg button{flex:1;padding:8px 7px}.tabs{overflow-x:auto;white-space:nowrap}.tabs button{margin-right:14px}.panel{padding:17px}.qtext{font-size:19px}.grade-row .btn{flex:1}.card-controls{align-items:flex-start}.card-controls .row{flex-wrap:wrap}}
  @media (max-width:360px){.seg button{font-size:12px}.tabs button{font-size:13px;margin-right:10px}.qtext{font-size:18px}}
  select, input[type=text]{
    font-family:var(--sans);font-size:14px;padding:8px 10px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--card);color:var(--ink);
  }
  label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px;}

  /* ---------- Flashcards & interview question card ---------- */
  .qnum{font-family:var(--serif);font-size:13px;color:var(--brass-deep);font-weight:600;letter-spacing:.02em;margin-bottom:10px;}
  .qcat{color:var(--ink-soft);font-weight:500;}
  .qtext{font-family:var(--serif);font-size:21px;line-height:1.4;color:var(--ink);margin:0 0 18px;}
  .answer-box{
    border-top:1px solid var(--line-soft);margin-top:18px;padding-top:16px;
  }
  .answer-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--forest);margin-bottom:6px;}
  .answer-text{font-family:var(--serif);font-size:16.5px;color:var(--ink);}
  .answer-note{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .row.between{justify-content:space-between;}
  .grade-row{margin-top:18px;display:flex;gap:10px;}
  .card-controls{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}

  .state-input-note{
    background:var(--paper-deep);border:1px dashed var(--brass);border-radius:var(--radius);
    padding:10px 12px;font-size:13px;color:var(--ink-soft);margin-top:6px;
  }

  /* ---------- Progress bar (interview) ---------- */
  .progress-track{height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin-bottom:18px;}
  .progress-fill{height:100%;background:var(--brass);}

  /* ---------- Browse list ---------- */
  .browse-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .browse-controls input[type=text]{flex:1;min-width:160px;}
  .cat-group{margin-bottom:22px;}
  .cat-group h3{
    font-family:var(--serif);font-size:15px;color:var(--navy);margin:0 0 10px;
    padding-bottom:6px;border-bottom:1px solid var(--line);
  }
  .qa-item{padding:11px 0;border-bottom:1px solid var(--line-soft);}
  .qa-item:last-child{border-bottom:none;}
  .qa-item .qq{font-weight:600;font-size:14.5px;margin-bottom:4px;}
  .qa-item .qq .n{color:var(--brass-deep);font-weight:700;margin-right:6px;}
  .qa-item .aa{font-size:13.5px;color:var(--ink-soft);}

  /* ---------- Score screen ---------- */
  .score-hero{text-align:center;padding:14px 0 6px;}
  .score-num{font-family:var(--serif);font-size:52px;font-weight:600;color:var(--navy);line-height:1;}
  .score-verdict{font-size:15px;font-weight:700;margin-top:8px;}
  .score-verdict.pass{color:var(--forest);}
  .score-verdict.fail{color:var(--brick);}
  .missed-list{margin-top:20px;}
  .missed-list h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:8px;}

  /* ---------- Settings ---------- */
  .field{margin-bottom:14px;}
  .field input{width:100%;}
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:480px){.settings-grid{grid-template-columns:1fr;}}

  footer{margin-top:38px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-soft);}
  footer a{color:var(--ink-soft);}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#F6F1E3;padding:9px 16px;border-radius:var(--radius);
    font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.18);opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .checkbox-row{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);}
  .top-actions{display:flex;justify-content:flex-end;margin-bottom:10px;gap:8px;}
  .theme-btn{min-width:42px;padding:8px 11px;font-size:16px;}
  .brand-badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brass-deep);margin-top:2px;}
  .home-hero{background:linear-gradient(135deg,var(--navy),var(--navy-soft));color:#F6F1E3;border-radius:8px;padding:24px;margin-bottom:16px;box-shadow:0 8px 22px rgba(31,51,85,.12)}
  .home-hero h2{font-family:var(--serif);font-size:30px;line-height:1.15;margin:0 0 8px}
  .home-hero p{margin:0;color:#EEF2F7;max-width:58ch}
  .home-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
  .home-actions .btn{width:100%;text-align:left}
  .stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}
  .stat-card .value{font-family:var(--serif);font-size:28px;color:var(--navy);font-weight:600;line-height:1}
  .stat-card .label{font-size:11px;color:var(--ink-soft);margin-top:6px}
  .section-title{font-family:var(--serif);font-size:19px;color:var(--navy);margin:0 0 10px}
  .feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .feature-card{border:1px solid var(--line-soft);background:var(--paper);padding:14px;border-radius:5px}
  .feature-card strong{display:block;color:var(--navy);margin-bottom:3px}
  .feature-card span{font-size:12.5px;color:var(--ink-soft)}
  .progress-mini{height:7px;background:var(--line-soft);border-radius:10px;overflow:hidden;margin-top:8px}
  .progress-mini span{display:block;height:100%;background:var(--brass)}
  .history-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .history-table th,.history-table td{text-align:left;padding:8px;border-bottom:1px solid var(--line-soft)}
  .history-table th{color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .info-list{margin:8px 0 0;padding-left:18px;color:var(--ink-soft);font-size:13px}
  .notice{background:var(--paper-deep);border:1px solid var(--line);border-radius:5px;padding:12px 14px;font-size:12.5px;color:var(--ink-soft)}
  .link-btn{background:none;border:0;padding:0;color:var(--navy);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
  .footer-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}

  body[data-theme="dark"]{
    --paper:#12171D;--paper-deep:#1B232C;--card:#182028;--ink:#F2F0EA;--ink-soft:#B8B8B0;--navy:#D7E4F7;--navy-soft:#AFC4E2;--brass:#D3B56B;--brass-deep:#E0C77F;--brick:#E38C82;--brick-bg:#382321;--forest:#86B79B;--forest-bg:#20352A;--line:#39414A;--line-soft:#2D353E;
    background-image:radial-gradient(circle at 15% 8%,rgba(211,181,107,.06),transparent 45%),radial-gradient(circle at 90% 85%,rgba(150,180,220,.05),transparent 40%);
  }
  body[data-theme="dark"] .home-hero{background:linear-gradient(135deg,#1D3557,#27466F);}
  body[data-theme="dark"] .home-hero p{color:#E7EDF6}
  body[data-theme="dark"] .btn{color:#111820}
  body[data-theme="dark"] .btn.secondary{color:var(--navy);}
  body[data-theme="dark"] .seg button.active{color:#111820}
  body[data-theme="dark"] .feature-card{background:var(--paper-deep)}
  body[data-theme="dark"] a{color:var(--navy)}
  @media (max-width:560px){.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.home-actions{grid-template-columns:1fr}.feature-grid{grid-template-columns:1fr}.home-hero h2{font-size:25px}}

.certificate-actions{margin-top:16px;padding-top:16px;border-top:1px solid #ddd}.cert-name{max-width:360px}.cert-note{margin-top:8px}.cert-btn{margin-top:8px}

/* MONETIZATION */
.monetize-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.money-card{border:1px solid var(--line,#ddd);border-radius:12px;padding:18px;background:var(--card,#fff)}.money-card h3{margin:0 0 7px}.money-card p{margin:7px 0;color:var(--muted,#667085)}.money-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.ad-slot{min-height:90px;border:1px dashed #c8ccd4;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;margin:14px 0;color:#7a7f89;font-size:12px;background:rgba(127,127,127,.04)}.ad-slot:empty{display:none}.disclosure{font-size:12px;color:var(--muted,#667085);margin-top:10px}.support-list{display:grid;gap:8px;margin-top:10px}.support-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line,#ddd);border-radius:9px}.money-badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;background:#f1ead7;color:#6b531d;margin-bottom:8px}@media(max-width:700px){.monetize-grid{grid-template-columns:1fr}}
</style>

<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   DATA — official USCIS civics questions (public domain).
   2008 version: 100 questions (still the current test for
   applicants who filed Form N-400 before Oct 20, 2025).
   2025 version: 128 questions (for applicants who filed on or
   after Oct 20, 2025).
   Row format: [n, catIndex, question, answer-or-null, code]
   code may contain "star" (65/20 exemption list), "dyn:key"
   (answer changes with current officeholders), "state:key"
   (answer is personal / depends on the applicant's state).
   ============================================================ */

const CATS_08 = ["Principles of American Democracy","System of Government","Rights and Responsibilities","Colonial Period & Independence","The 1800s","Recent American History","Geography","Symbols","Holidays"];
const CATS_25 = ["Principles of American Government","System of Government","Rights and Responsibilities","Colonial Period & Independence","The 1800s","Recent History","American Symbols","National Holidays"];

const ROWS_08 = [
[1,0,`What is the supreme law of the land?`,`The Constitution`],
[2,0,`What does the Constitution do?`,`Sets up the government; defines the government; protects basic rights of Americans`],
[3,0,`The idea of self-government is in the first three words of the Constitution. What are these words?`,`We the People`],
[4,0,`What is an amendment?`,`A change to the Constitution; an addition to the Constitution`],
[5,0,`What do we call the first ten amendments to the Constitution?`,`The Bill of Rights`],
[6,0,`What is one right or freedom from the First Amendment?`,`Speech; religion; assembly; press; petition the government`,`star`],
[7,0,`How many amendments does the Constitution have?`,`Twenty-seven (27)`],
[8,0,`What did the Declaration of Independence do?`,`Announced our independence from Great Britain; declared our independence; said the United States is free from Great Britain`],
[9,0,`What are two rights in the Declaration of Independence?`,`Life, liberty, and the pursuit of happiness`],
[10,0,`What is freedom of religion?`,`You can practice any religion, or not practice a religion.`],
[11,0,`What is the economic system in the United States?`,`Capitalist economy; market economy`,`star`],
[12,0,`What is the "rule of law"?`,`Everyone must follow the law; leaders must obey the law; government must obey the law; no one is above the law.`],
[13,1,`Name one branch or part of the government.`,`Congress (legislative); President (executive); the courts (judicial)`,`star`],
[14,1,`What stops one branch of government from becoming too powerful?`,`Checks and balances; separation of powers`],
[15,1,`Who is in charge of the executive branch?`,`The President`],
[16,1,`Who makes federal laws?`,`Congress; Senate and House of Representatives; the U.S. or national legislature`],
[17,1,`What are the two parts of the U.S. Congress?`,`The Senate and House of Representatives`,`star`],
[18,1,`How many U.S. Senators are there?`,`One hundred (100)`],
[19,1,`We elect a U.S. Senator for how many years?`,`Six (6)`],
[20,1,`Who is one of your state's U.S. Senators now?`,null,`star|state:senator`],
[21,1,`The House of Representatives has how many voting members?`,`Four hundred thirty-five (435)`],
[22,1,`We elect a U.S. Representative for how many years?`,`Two (2)`],
[23,1,`Name your U.S. Representative.`,null,`state:rep`],
[24,1,`Who does a U.S. Senator represent?`,`All the people of the state`],
[25,1,`Why do some states have more Representatives than other states?`,`Because of the state's population; because they have more people`],
[26,1,`We elect a President for how many years?`,`Four (4)`],
[27,1,`In what month do we vote for President?`,`November`,`star`],
[28,1,`What is the name of the President of the United States now?`,null,`star|dyn:president`],
[29,1,`What is the name of the Vice President of the United States now?`,null,`dyn:vp`],
[30,1,`If the President can no longer serve, who becomes President?`,`The Vice President`],
[31,1,`If both the President and the Vice President can no longer serve, who becomes President?`,`The Speaker of the House`],
[32,1,`Who is the Commander in Chief of the military?`,`The President`],
[33,1,`Who signs bills to become laws?`,`The President`],
[34,1,`Who vetoes bills?`,`The President`],
[35,1,`What does the President's Cabinet do?`,`Advises the President`],
[36,1,`What are two Cabinet-level positions?`,`Secretary of State; Secretary of the Treasury; Secretary of Defense; Attorney General; Secretary of Agriculture, Commerce, Education, Energy, Health and Human Services, Homeland Security, Housing and Urban Development, the Interior, Labor, Transportation, Veterans Affairs; Vice President`],
[37,1,`What does the judicial branch do?`,`Reviews laws; explains laws; resolves disputes; decides if a law goes against the Constitution`],
[38,1,`What is the highest court in the United States?`,`The Supreme Court`],
[39,1,`How many justices are on the Supreme Court?`,null,`dyn:scotusSeats`],
[40,1,`Who is the Chief Justice of the United States now?`,null,`dyn:chiefJustice`],
[41,1,`Under our Constitution, some powers belong to the federal government. What is one power of the federal government?`,`To print money; to declare war; to create an army; to make treaties`],
[42,1,`Under our Constitution, some powers belong to the states. What is one power of the states?`,`Provide schooling and education; provide protection (police); provide safety (fire departments); give a driver's license; approve zoning and land use`],
[43,1,`Who is the Governor of your state now?`,null,`state:governor`],
[44,1,`What is the capital of your state?`,null,`star|state:capital`],
[45,1,`What are the two major political parties in the United States?`,`Democratic and Republican`,`star`],
[46,1,`What is the political party of the President now?`,null,`dyn:presidentParty`],
[47,1,`What is the name of the Speaker of the House of Representatives now?`,null,`dyn:speaker`],
[48,2,`There are four amendments to the Constitution about who can vote. Describe one of them.`,`Citizens eighteen (18) and older can vote; you don't have to pay a poll tax to vote; any citizen can vote (women and men); a male citizen of any race can vote`],
[49,2,`What is one responsibility that is only for United States citizens?`,`Serve on a jury; vote in a federal election`,`star`],
[50,2,`Name one right only for United States citizens.`,`Vote in a federal election; run for federal office`],
[51,2,`What are two rights of everyone living in the United States?`,`Freedom of expression; freedom of speech; freedom of assembly; freedom to petition the government; freedom of worship; the right to bear arms`],
[52,2,`What do we show loyalty to when we say the Pledge of Allegiance?`,`The United States; the flag`],
[53,2,`What is one promise you make when you become a United States citizen?`,`Give up loyalty to other countries; defend the Constitution and laws of the United States; obey the laws of the United States; serve in the U.S. military if needed; serve the nation if needed; be loyal to the United States`],
[54,2,`How old do citizens have to be to vote for President?`,`Eighteen (18) and older`,`star`],
[55,2,`What are two ways that Americans can participate in their democracy?`,`Vote; join a political party; help with a campaign; join a civic or community group; give an elected official your opinion; call Senators and Representatives; run for office; write to a newspaper`],
[56,2,`When is the last day you can send in federal income tax forms?`,`April 15`,`star`],
[57,2,`When must all men register for the Selective Service?`,`At age eighteen (18); between eighteen (18) and twenty-six (26)`],
[58,3,`What is one reason colonists came to America?`,`Freedom; political liberty; religious freedom; economic opportunity; to practice their religion; to escape persecution`],

function buildDeck(rows, cats){
  return rows.map(r=>{
    const [n,cat,q,a,code] = r;
    const o = {n, cat, catName:cats[cat], q, a};
    if(code){
      if(code.includes('star')) o.star = true;
      const dm = code.match(/dyn:(\w+)/); if(dm) o.dynKey = dm[1];
      const sm = code.match(/state:(\w+)/); if(sm) o.stateKey = sm[1];
    }
    return o;
  });
}

function getAnswer(item){
  if(item.dynKey) return CURRENT[item.dynKey];
  if(item.stateKey){
    const v = state.stateInfo[item.stateKey];
    return v && v.trim() ? esc(v.trim()) : null;
  }
  return item.a;
}
function isPersonal(item){ return !!(item.dynKey || item.stateKey); }

function esc(str){
  if(str===null || str===undefined) return '';
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function shuffleArr(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; }
  return b;
}

function grade65Twenty(correct){
  const deck = DECKS['2025'];
  const st = state.sixtyFiveTwenty;
  if(st.finished) return;
  const n = st.order[st.idx];
  st.answers.push({n, correct});
  const c = st.answers.filter(a=>a.correct).length;
  const answered = st.answers.length;
  const remaining = st.order.length - answered;
  if(c >= 6 || c + remaining < 6 || answered >= 10){
    st.finished = true;
    const prog = state.progress['2025'];
    st.answers.filter(a=>!a.correct).forEach(a=>{ if(!prog.missed.includes(a.n)) prog.missed.push(a.n); });
    st.answers.filter(a=>a.correct).forEach(a=>{ prog.missed = prog.missed.filter(x=>x!==a.n); });
    prog.history.unshift({date:new Date().toISOString().slice(0,10), correct:c, total:answered, percent:answered?Math.round(c/answered*100):0, passed:c>=6, type:'65/20 practice'});
    prog.history=prog.history.slice(0,20);
    saveJSON('progress-2025', prog);
  } else {
    st.idx++;
  }
  renderMode();
}

function progressStats(version){

}

      <button data-act="mode" data-m="65-20" class="${state.mode==='65-20'?'active':''}">2025 65/20 · 2026</button>
      <button data-act="mode" data-m="browse" class="${state.mode==='browse'?'active':''}">All questions</button>
      <button data-act="mode" data-m="progress" class="${state.mode==='progress'?'active':''}">Progress</button>
      <button data-act="mode" data-m="settings" class="${state.mode==='settings'?'active':''}">My state</button>
      <button data-act="mode" data-m="about" class="${state.mode==='about'?'active':''}">About</button>
      <button data-act="mode" data-m="monetize" class="${state.mode==='monetize'?'active':''}">Support</button>
    </div>

    <div id="modeBody"></div>

    <footer>
      Independent study tool. Not affiliated with or endorsed by USCIS. Dynamic answers were last reviewed ${LAST_VERIFIED}; always confirm changeable answers at <a href="https://www.uscis.gov/citizenship/testupdates" target="_blank" rel="noopener">USCIS test updates</a> before your interview.
      <div class="footer-links"><button class="link-btn" data-act="mode" data-m="about">About & Privacy</button><a href="https://www.uscis.gov/citizenship/find-study-materials-and-resources/study-for-the-test" target="_blank" rel="noopener">Official USCIS study materials</a></div>
    </footer>
  `;
  bindHeader();
  const theme=document.getElementById('themeToggle'); if(theme) theme.onclick=toggleTheme;
  renderMode();
}

function sealSVG(){
  return `<svg class="seal" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
    <circle cx="30" cy="30" r="27" fill="none" stroke="#9C7A32" stroke-width="1.4"/>
    <circle cx="30" cy="30" r="22" fill="none" stroke="#9C7A32" stroke-width="0.7"/>
    <g fill="#1F3355">
      <path d="M30 14 L32.6 22.2 L41 22.2 L34.2 27.2 L36.8 35.4 L30 30.4 L23.2 35.4 L25.8 27.2 L19 22.2 L27.4 22.2 Z"/>
    </g>
  </svg>`;
}

function bindHeader(){
  document.querySelectorAll('[data-act="version"]').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.v === state.version) return;
      state.version = b.dataset.v;
      state.fc.catFilter = 'all';
      state.fc.starOnly = false;
      resetFlashcards();
      state.iv = { order:[], idx:0, answers:[], revealed:false, finished:false };
       state.sixtyFiveTwenty = { order:[], idx:0, answers:[], finished:false };
      if(state.mode==='interview') startInterview();
       if(state.mode==='65-20') start65Twenty();
      render();
    };
  });
  document.querySelectorAll('[data-act="mode"]').forEach(b=>{
    b.onclick = ()=>{
      state.mode = b.dataset.m;
      if(state.mode==='interview') startInterview();
      if(state.mode==='65-20') start65Twenty();
      render();
    };
  });
}

function renderMode(){
  const body = document.getElementById('modeBody');
  if(state.mode==='home') body.innerHTML = homeView();
  else if(state.mode==='flashcards') body.innerHTML = flashcardsView();
  else if(state.mode==='interview') body.innerHTML = interviewView();
  else if(state.mode==='65-20') body.innerHTML = sixtyFiveTwentyView();
  else if(state.mode==='browse') body.innerHTML = browseView();
  else if(state.mode==='progress') body.innerHTML = progressView();
  else if(state.mode==='settings') body.innerHTML = settingsView();
  else if(state.mode==='about') body.innerHTML = aboutView();
  else if(state.mode==='monetize') body.innerHTML = monetizationView();
  bindModeEvents();
}

/* ============================================================
   FLASHCARDS
   ============================================================ */
function flashcardsView(){
  const deck = currentDeck();
  if(state.fc.order.length===0) resetFlashcards();
  const total = state.fc.order.length;
  if(total===0){
    return `<div class="panel"><p class="muted">No questions match that filter. Try a different category.</p></div>`;
  }
  if(state.fc.idx >= total) state.fc.idx = 0;
  const n = state.fc.order[state.fc.idx];
  const item = deck.rows.find(r=>r.n===n);
  const ans = getAnswer(item);
  const personal = isPersonal(item);
  const missedSet = new Set(state.progress[state.version].missed);

  return `
    <div class="row" style="margin-bottom:14px;justify-content:space-between;">
      <div class="row" style="gap:8px;">
        <select id="fcCat">
          <option value="all" ${state.fc.catFilter==='all'?'selected':''}>All categories</option>
          <option value="star" ${state.fc.catFilter==='star'?'selected':''}>65/20 list only</option>
          ${deck.cats.map(c=>`<option value="${c}" ${state.fc.catFilter===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <label class="checkbox-row"><input type="checkbox" id="fcShuffle" ${state.fc.shuffle?'checked':''}/> Shuffle</label>
      </div>
      <button class="btn secondary" id="fcMissedBtn">Review missed (${missedSet.size})</button>
    </div>

    <div class="panel">
      <div class="row between">
        <span class="qnum">No. ${item.n} <span class="qcat">· ${item.catName}</span></span>
        ${item.star? `<span class="pill">65/20 list</span>`:''}
      </div>
      <p class="qtext">${item.q}</p>

      ${state.fc.revealed ? `
        <div class="answer-box">
          <div class="answer-label">Answer</div>
          ${ans ? `<div class="answer-text">${ans}</div>` : `<div class="state-input-note">You haven't entered this yet — add it under <strong>My state info</strong> so it shows up here.</div>`}
          ${personal ? `<div class="answer-note">${item.dynKey ? `Current as of ${LAST_VERIFIED} — confirm before your interview.` : `This is personal to you — answer with your own state's information.`}</div>` : ''}
        </div>
        <div class="grade-row">
          <button class="btn good" id="fcGood">✓ I knew it</button>
          <button class="btn bad" id="fcBad">✗ Need to review</button>
        </div>
      ` : `
        <div class="card-controls" style="margin-top:8px;">
          <button class="btn" id="fcReveal">Show answer</button>
        </div>
      `}
    </div>

    <div class="card-controls">
      <span class="muted small">Card ${state.fc.idx+1} of ${total}</span>
      <div class="row" style="gap:8px;">
        <button class="btn secondary" id="fcPrev" ${state.fc.idx===0?'disabled':''}>Back</button>
        <button class="btn secondary" id="fcNext">Next</button>
      </div>
    </div>
  `;
}

function bindFlashcardEvents(){
  const cat = document.getElementById('fcCat');
  if(cat) cat.onchange = ()=>{ state.fc.catFilter = cat.value; resetFlashcards(); renderMode(); };
  const sh = document.getElementById('fcShuffle');
  if(sh) sh.onchange = ()=>{ state.fc.shuffle = sh.checked; resetFlashcards(); renderMode(); };
  const reveal = document.getElementById('fcReveal');
  if(reveal) reveal.onclick = ()=>{ state.fc.revealed = true; renderMode(); };
  const good = document.getElementById('fcGood');
  if(good) good.onclick = ()=> gradeFlashcard(true);
  const bad = document.getElementById('fcBad');
  if(bad) bad.onclick = ()=> gradeFlashcard(false);
  const prev = document.getElementById('fcPrev');
  if(prev) prev.onclick = ()=>{ state.fc.idx = Math.max(0, state.fc.idx-1); state.fc.revealed=false; renderMode(); };
  const next = document.getElementById('fcNext');
  if(next) next.onclick = ()=>{ nextFlashcard(); };
  const missedBtn = document.getElementById('fcMissedBtn');
  if(missedBtn) missedBtn.onclick = ()=>{
    const missed = state.progress[state.version].missed;
    if(missed.length===0){ toast('No missed questions saved yet.'); return; }
    state.fc.catFilter = 'all'; state.fc.starOnly=false;
    state.fc.order = state.fc.shuffle ? shuffleArr(missed.slice()) : missed.slice();
    state.fc.idx = 0; state.fc.revealed=false;
    renderMode();
  };
}

async function gradeFlashcard(gotIt){
  const deck = currentDeck();
  const n = state.fc.order[state.fc.idx];
  const prog = state.progress[state.version];
  if(gotIt){
    prog.missed = prog.missed.filter(x=>x!==n);
  } else if(!prog.missed.includes(n)){
    prog.missed.push(n);
  }
  await saveJSON(`progress-${state.version}`, prog);
  nextFlashcard();
}

function nextFlashcard(){
  state.fc.revealed = false;
  if(state.fc.idx < state.fc.order.length-1) state.fc.idx++;
  else { toast('You reached the end of this set — starting over.'); state.fc.idx = 0; }
  renderMode();
}

/* ============================================================
   MOCK INTERVIEW
   ============================================================ */
function interviewView(){
  const deck = currentDeck();
  if(state.iv.order.length===0) startInterview();

  if(state.iv.finished){
    const correct = state.iv.answers.filter(a=>a.correct).length;
    const total = state.iv.answers.length;
    const passed = correct >= deck.need;
    const missedItems = state.iv.answers.filter(a=>!a.correct).map(a=>deck.rows.find(r=>r.n===a.n));
    return `
      <div class="panel">
        <div class="score-hero">
          <div class="score-num">${correct} / ${total}</div>
          <div class="score-verdict ${passed?'pass':'fail'}">${passed? 'You passed this practice round' : 'Not quite — worth another round'}</div>
          <p class="muted small" style="margin-top:6px;">Practice rounds stop when you reach ${deck.need} correct answers or when it is no longer possible to reach the passing score.</p>
        </div>
        ${passed ? `<div class="certificate-actions"><label for="certName"><strong>Get your practice certificate</strong></label><input class="cert-name" id="certName" type="text" placeholder="Enter your full name" maxlength="80"/><button class="btn cert-btn" id="certBtn">🏆 Generate Certificate</button><p class="muted small cert-note">You can print it or choose “Save as PDF”. This is a practice certificate, not an official USCIS document.</p></div>` : ''}
        ${missedItems.length ? `
          <div class="missed-list">
            <h4>Worth reviewing</h4>
            ${missedItems.map(it=>`
              <div class="qa-item">
                <div class="qq"><span class="n">No. ${it.n}</span>${it.q}</div>
                <div class="aa">${getAnswer(it) || 'Set this in My state info to see your answer.'}</div>
              </div>
            `).join('')}
          </div>
        `: `<p class="muted" style="margin-top:16px;">Nothing missed this round — nice work.</p>`}
        <div class="card-controls">
          <span></span>
          <button class="btn" id="ivRestart">Start another round</button>
        </div>
      </div>
    `;
  }

  const idx = state.iv.idx;
  const n = state.iv.order[idx];
  const item = deck.rows.find(r=>r.n===n);
  const ans = getAnswer(item);
  const pct = Math.round((idx/state.iv.order.length)*100);

  return `
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="panel">
      <div class="row between">
        <span class="qnum">Question ${idx+1} of ${state.iv.order.length}</span>
        ${item.star? `<span class="pill">65/20 list</span>`:''}
      </div>
      <p class="qtext">${item.q}</p>

      ${state.iv.revealed ? `
        <div class="answer-box">
          <div class="answer-label">Answer</div>
          ${ans ? `<div class="answer-text">${ans}</div>` : `<div class="state-input-note">You haven't entered this yet — add it under <strong>My state info</strong>.</div>`}
        </div>
        <div class="grade-row">
          <button class="btn good" id="ivGood">✓ I got it right</button>
          <button class="btn bad" id="ivBad">✗ I missed it</button>
        </div>
      ` : `
        <div class="card-controls" style="margin-top:8px;">
          <button class="btn" id="ivReveal">Show answer</button>
        </div>
      `}
    </div>
  `;
}

function bindInterviewEvents(){
  const cert=document.getElementById('certBtn'); if(cert) cert.onclick=()=>{ const score=state.iv.answers.filter(a=>a.correct).length; openCertificate(document.getElementById('certName').value, score, state.iv.answers.length, `${state.version} Civics Test Practice`); };
  const restart = document.getElementById('ivRestart');
  if(restart) restart.onclick = ()=>{ startInterview(); renderMode(); };
  const reveal = document.getElementById('ivReveal');
  if(reveal) reveal.onclick = ()=>{ state.iv.revealed = true; renderMode(); };
  const good = document.getElementById('ivGood');
  if(good) good.onclick = ()=> gradeInterview(true);
  const bad = document.getElementById('ivBad');
  if(bad) bad.onclick = ()=> gradeInterview(false);
}

async function gradeInterview(correct){
  const deck = currentDeck();
  const n = state.iv.order[state.iv.idx];
  state.iv.answers.push({n, correct});
  const prog = state.progress[state.version];
  if(correct) prog.missed = prog.missed.filter(x=>x!==n);
  else if(!prog.missed.includes(n)) prog.missed.push(n);

  const correctCount = state.iv.answers.filter(a=>a.correct).length;
  const answered = state.iv.answers.length;
  const remaining = state.iv.order.length - answered;
  const passReached = correctCount >= deck.need;
  const impossible = correctCount + remaining < deck.need;
  const exhausted = answered >= state.iv.order.length;

  state.iv.revealed = false;
  if(passReached || impossible || exhausted){
    state.iv.finished = true;
    prog.history.unshift({date:new Date().toISOString().slice(0,10), correct:correctCount, total:answered, percent:answered?Math.round(correctCount/answered*100):0, passed:correctCount>=deck.need, type:`${state.version} mock interview`});
    prog.history = prog.history.slice(0,20);
  } else {
    state.iv.idx++;
  }
  await saveJSON(`progress-${state.version}`, prog);
  renderMode();
}

/* ============================================================
   BROWSE / ALL QUESTIONS
   ============================================================ */
let browseQuery = '';
function browseView(){
  const deck = currentDeck();
  const q = browseQuery.trim().toLowerCase();
  const groups = deck.cats.map((catName, ci)=>{
    let items = deck.rows.filter(r=>r.cat===ci);
    if(q) items = items.filter(r=> r.q.toLowerCase().includes(q) || (r.a && r.a.toLowerCase().includes(q)));
    return {catName, items};
  }).filter(g=>g.items.length);

  return `
    <div class="browse-controls">
      <input type="text" id="browseSearch" placeholder="Search questions or answers…" value="${esc(browseQuery)}"/>
    </div>
    ${groups.length===0 ? `<p class="muted">No matches.</p>` : groups.map(g=>`
      <div class="cat-group">
        <h3>${g.catName}</h3>
        ${g.items.map(it=>`
          <div class="qa-item">
            <div class="qq"><span class="n">No. ${it.n}</span>${it.q}${it.star? ' <span class="pill">65/20</span>':''}</div>
            <div class="aa">${getAnswer(it) || '<em>Personal answer — set this under My state info.</em>'}</div>
          </div>
        `).join('')}
      </div>
    `).join('')}
  `;
}
function bindBrowseEvents(){
  const s = document.getElementById('browseSearch');
  if(s){
    s.oninput = ()=>{ browseQuery = s.value; renderMode(); s.focus(); s.setSelectionRange(s.value.length, s.value.length); };
  }
}

/* ============================================================
   SETTINGS / MY STATE INFO
   ============================================================ */
function settingsView(){
  const si = state.stateInfo;
  return `
    <div class="panel">
      <p class="muted small" style="margin-top:0;">Several questions ask about your own state — its senators, your representative, its governor, and its capital. These answers vary by person, so USCIS doesn't publish a single correct answer. Fill in yours once and it will appear automatically in flashcards, the mock interview, and the full list.</p>
      <div class="field">
        <label for="siState">Your state (or D.C. / territory)</label>
        <input type="text" id="siState" value="${esc(si.stateName)}" placeholder="e.g., Texas"/>
      </div>
      <div class="settings-grid">
        <div class="field">
          <label for="siSenator">One of your U.S. senators</label>
          <input type="text" id="siSenator" value="${esc(si.senator)}" placeholder="Name"/>
        </div>
        <div class="field">
          <label for="siRep">Your U.S. representative</label>
          <input type="text" id="siRep" value="${esc(si.rep)}" placeholder="Name"/>
        </div>
        <div class="field">
          <label for="siGov">Your governor</label>
          <input type="text" id="siGov" value="${esc(si.governor)}" placeholder="Name"/>
        </div>
        <div class="field">
          <label for="siCap">Your state capital</label>
          <input type="text" id="siCap" value="${esc(si.capital)}" placeholder="City"/>
        </div>
      </div>
      <p class="small muted">You can look these up at <a href="https://www.senate.gov/senators/senators-contact.htm" target="_blank" rel="noopener">senate.gov</a> and <a href="https://www.house.gov/representatives" target="_blank" rel="noopener">house.gov</a>. Saved locally in this browser. This site does not send this information to a server.</p>
      <button class="btn" id="siSave">Save</button>
    </div>
  `;
}
function bindSettingsEvents(){
  const save = document.getElementById('siSave');
  if(save) save.onclick = async ()=>{
    state.stateInfo = {
      stateName: document.getElementById('siState').value,
      senator: document.getElementById('siSenator').value,
      rep: document.getElementById('siRep').value,
      governor: document.getElementById('siGov').value,
      capital: document.getElementById('siCap').value,
    };
    await saveJSON('state-info', state.stateInfo);
    toast('Saved.');
  };
}

function bindModeEvents(){
  if(state.mode==='flashcards') bindFlashcardEvents();
  else if(state.mode==='interview') bindInterviewEvents();
  if(state.mode==='65-20'){
    const good=document.getElementById('sixtyGood'); if(good) good.onclick=()=>grade65Twenty(true);
    const bad=document.getElementById('sixtyBad'); if(bad) bad.onclick=()=>grade65Twenty(false);
    const restart=document.getElementById('sixtyRestart'); if(restart) restart.onclick=()=>{start65Twenty(); renderMode();};
    const cert=document.getElementById('cert65'); if(cert) cert.onclick=()=>{
      const st=state.sixtyFiveTwenty;
      const score=st.answers.filter(a=>a.correct).length;
      openCertificate(document.getElementById('certName65').value, score, st.answers.length, '2025 65/20 Practice Test · Current for 2026');
    };
  }
  else if(state.mode==='browse') bindBrowseEvents();
  else if(state.mode==='progress') bindProgressEvents();
  else if(state.mode==='settings') bindSettingsEvents();
  else if(state.mode==='home') bindHomeEvents();
}

init();
</script>
